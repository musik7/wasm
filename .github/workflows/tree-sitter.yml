name: Build Tree-sitter Core WASM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Emscripten 3.1.60
        uses: mymindstorm/setup-emsdk@v12
        with:
          version: 3.1.60

      - name: Clone tree-sitter
        run: git clone --depth 1 https://github.com/tree-sitter/tree-sitter

      - name: Install deps
        working-directory: tree-sitter
        run: npm ci

      - name: Build WASM
        working-directory: tree-sitter
        run: npm run build-wasm

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tree-sitter-core-wasm
          path: |
            tree-sitter/tree-sitter.js
            tree-sitter/tree-sitter.wasm
