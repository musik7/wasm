name: Build QuickJS WASM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bellard/quickjs

      - uses: mymindstorm/setup-emsdk@v13
        with:
          version: 3.1.64

      - name: Download unicode data
        run: bash unicode_download.sh

      - name: Build qjs.js + qjs.wasm
        run: |
          emcc -O2 \
            qjs.c quickjs.c libregexp.c libunicode.c cutils.c \
            unicode/*.c \
            -o qjs.js \
            -s WASM=1 \
            -s MODULARIZE=1 \
            -s EXPORT_NAME=QuickJSModule \
            -s ALLOW_MEMORY_GROWTH=1

      - uses: actions/upload-artifact@v4
        with:
          name: quickjs-wasm
          path: |
            qjs.js
            qjs.wasm
