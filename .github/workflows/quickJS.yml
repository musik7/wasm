name: Build QuickJS WASM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bellard/quickjs

      - uses: mymindstorm/setup-emsdk@v13
        with:
          version: 3.1.64

      - name: Download unicode data
        run: |
          bash unicode_download.sh # <-- ini yg kurang

      - name: Build with release.sh
        run: |
          bash release.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quickjs-wasm
          path: |
            qjs.js
            qjs.wasm
            qjsc.js
            qjsc.wasm
